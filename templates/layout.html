<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "FastAPI Blog" }}</title>
  <link rel="manifest" href="{{ url_for('static', path='site.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', path='icons/favicon.ico') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a class="text-lg font-bold tracking-tight text-slate-950" href="{{ url_for('home') }}">FastAPI Blog</a>
      <div class="flex items-center gap-4 text-sm font-medium">
        <a class="text-slate-600 transition hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-4" href="{{ url_for('home') }}">Home</a>
        <a class="text-slate-600 transition hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-4" href="/api/posts">API</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8 sm:py-10">
    {% block content %}{% endblock content %}
  </main>
</body>
</html>
