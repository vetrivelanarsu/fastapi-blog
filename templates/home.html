{% extends "layout.html" %}
{% block content %}
  <section class="space-y-5">
    {% for post in posts %}
      <article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm transition hover:border-slate-300 hover:shadow-md">
        <div class="flex items-start gap-4">
          <img class="article-img h-16 w-16 shrink-0 rounded-full border border-slate-200 bg-slate-100 object-cover shadow-sm"
               src="{{ url_for('static', path='profile_pics/default.png') }}"
               alt="{{ post.author }}'s profile picture"
               width="64"
               height="64"
               loading="lazy">
          <div class="min-w-0 flex-1">
            <div class="mb-2 border-b border-slate-200 pb-2">
              <a class="mr-2 font-semibold text-sky-700 transition hover:text-slate-950" href="#">{{ post.author }}</a>
              <small class="text-sm text-slate-500">{{ post.date_posted }}</small>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-950">
              <a class="transition hover:text-sky-700" href="#">{{ post.title }}</a>
            </h2>
            <p class="article-content mt-3 text-lg leading-8 text-slate-700">{{ post.content }}</p>
          </div>
        </div>
      </article>
    {% endfor %}
  </section>
{% endblock content %}
